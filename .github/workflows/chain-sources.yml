# chain-sources.yml — single-chain `sources` workflow (weekly).
#
# SPEC LINK: docs/specs/00-architecture/115_scheduling.md §2, §2.1, §3, §4
# SPEC LINK: docs/specs/00-architecture/113_supabase_infrastructure.md §4, §8
#
# Inertness (P3-D6, Spec 115 §3): `schedule:` committed COMMENTED OUT.
# Phase 4.3 activation = one PR uncommenting it. `workflow_dispatch` active.

name: chain-sources

on:
  # Phase 4.3 activation — uncomment (Spec 115 §3)
  schedule:
    - cron: '0 13 * * 0'   # ~8 AM ET Sunday, weekly (Spec 115 §2 table row 2; §2.1 DST note)
  workflow_dispatch:
    inputs:
      expected_sha:
        # Spec 124 §5 R-AL (batch-2 Phase 0.8, 2026-09-15) — A CLOUD ACCEPTANCE
        # DISPATCH IS PINNED. EP-D13 (`tasks/lessons.md`) already required
        # `gh run view <id> --json headSha` to equal `git rev-parse HEAD` before
        # any verdict is read, but that rule lived only as prose: on 2026-09-15
        # runs 34964116903 and 34916671708 both graded `headSha 17058af7` while
        # the local HEAD was `824ef357` — the dispatcher had not pushed, and
        # nothing in the workflow could tell. The workflow cannot see the
        # dispatcher's local HEAD, so the dispatcher DECLARES it here and the
        # guard below refuses the run when the two disagree. Dispatch with:
        #   gh workflow run chain-sources.yml -f expected_sha=$(git rev-parse HEAD)
        # Left empty (the scheduled path, and any deliberately-unpinned manual
        # run) the guard does not fail — it prints the sha it IS grading, loudly,
        # so a verdict is never read against an unnamed commit.
        description: 'Commit SHA this dispatch is pinned to (R-AL). Pass $(git rev-parse HEAD) for an acceptance run; leave empty for an unpinned manual run.'
        required: false
        type: string

jobs:
  sources:
    runs-on: ubuntu-latest   # Spec 113 §8.2 option 3 (Network Restrictions off + strong auth) — resolved 2026-07-20
    # P3 (2026-08-24) — ceilings re-measured and raised. The two inherited figures
    # ("150 minutes of headroom" and "180 of 360 used") read as a contradiction and
    # are not one: 360−210=150 compares the platform max to the JOB ceiling, while
    # "180 of 360" compares it to the STEP ceiling. Both true, neither actionable
    # alone — a step can never outlive its job, so buying the chain room means
    # raising both numbers together.
    #
    #   platform per-job maximum (GitHub-hosted)   360   fixed, not ours
    #   job   timeout-minutes                      210 → 330   (360 − 30 reserved:
    #                                                   never run to the platform
    #                                                   wall; it kills with no logs)
    #   step  timeout-minutes                      180 → 300   (330 − 30 measured
    #                                                   job overhead: checkout +
    #                                                   setup-node + npm ci +
    #                                                   migrate --verify + guards +
    #                                                   verdict; today's 210−180=30,
    #                                                   preserved exactly)
    #   CHAIN_TIME_BUDGET_MINUTES                  unset → 290 (ceiling − 10)
    #   CHAIN_DURATION_BUDGET_MINUTES              unset → 300 (= ceiling; the
    #                                                   verdict tripwire warns past
    #                                                   80% → 240 min)
    #
    # Evidence (docs/reports/2026-08-22-sources-chain-evidence-base.md §5b, 11 cloud
    # runs): completions at 97.4 / 105.4 / 105.8 / 135.3 / 147.0 / 181.9 min. The
    # 290-min self-stop clears the 181.9-min high-water mark by 108.1; the 240-min
    # tripwire sits 58.1 above it, so it warns on an anomaly, not on a normal Sunday.
    # The 2026-08-03 run that died AT 180 would now self-stop cleanly instead, with a
    # `skipped: chain time budget reached` reason on every remaining step.
    #
    # NOT raised here: per-step `step_timeout_minutes` in scripts/manifest.json
    # (present on 1 of 27 sources steps — refresh_snapshot: 15). The only per-step
    # duration source is `pipeline_runs`, whose statistics the same report shows are
    # poisoned by the 39-day strand (link_parcels read 2,447 min against a 0.3-min
    # median). A per-step axe set from poisoned data kills healthy steps. That waits
    # on a clean post-P2 run.
    timeout-minutes: 330
    env:
      # SINGLE SOURCE for this chain's ceiling (Pipeline Rehab P1 — no second
      # hardcode): consumed by the step's `timeout-minutes`, by the step's
      # shell-computed soft budget, and by the verdict check's duration tripwire.
      SOURCES_STEP_TIMEOUT_MINUTES: '300'
    concurrency:
      group: ${{ github.workflow }}   # F8 fold 2026-07-20: derived from the workflow name so a
      cancel-in-progress: false       # future rename can't drift the concurrency group out of sync
    steps:
      - uses: actions/checkout@v4

      # Spec 124 §5 R-AL (batch-2 Phase 0.8, 2026-09-15) — the dispatch-pinning
      # guard. Two arms, both loud, neither inferable from a GitHub green tick:
      #   (1) the checkout really is `github.sha` (no ref drift between the
      #       event and the tree this job grades);
      #   (2) if the dispatcher declared `expected_sha`, it MATCHES — otherwise
      #       the job fails here, before a single step writes a ledger row, so
      #       an acceptance verdict can never be read off a stale `main`.
      # The unpinned path is not silent: the sha being graded is always echoed
      # as a notice, which is the fact EP-D13 asks a human to check by hand.
      - name: Guard — dispatch is pinned (R-AL / EP-D13)
        id: pin_guard
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "::notice title=Graded commit::this run grades ${CHECKED_OUT} (github.sha=${{ github.sha }}, event=${{ github.event_name }})"
          if [ "$CHECKED_OUT" != "${{ github.sha }}" ]; then
            echo "::error::checkout drift — the working tree is ${CHECKED_OUT} but the event names ${{ github.sha }}. Refusing to grade a tree the event did not name (Spec 124 R-AL)."
            exit 1
          fi
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$CHECKED_OUT" ]; then
            echo "::error::pinned dispatch mismatch — expected_sha=${EXPECTED_SHA} but this run grades ${CHECKED_OUT}. The dispatcher's HEAD was never pushed, or a newer commit landed first. Push, then re-dispatch (Spec 124 R-AL / EP-D13)."
            exit 1
          fi
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::warning title=Unpinned dispatch::no expected_sha was declared — this run is NOT valid as an R-AB acceptance run. Re-dispatch with -f expected_sha=\$(git rev-parse HEAD) to pin it."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Guard — environment (SUPABASE_DATABASE_URL + CA cert + ET drift)
        id: env_guard
        env: &pipeline-env
          PIPELINE_CHAIN: ${{ github.workflow }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT_PATH: ${{ github.workspace }}/scripts/certs/supabase-ca.pem
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "::error::SUPABASE_DATABASE_URL is empty — refusing to proceed (Spec 115 §3/§4 item 3 fail-safe-loud posture)."
            exit 1
          fi
          if [ ! -f "$SUPABASE_CA_CERT_PATH" ]; then
            echo "::error::CA cert not found at SUPABASE_CA_CERT_PATH=$SUPABASE_CA_CERT_PATH — every non-loopback connection in this workflow requires it (Spec 113 §4.2/§4.3). scripts/lib/ssl-config.js will throw the same fact per-connection if this guard is bypassed."
            exit 1
          fi
          ET_NOW=$(TZ='America/Toronto' date '+%Y-%m-%d %H:%M:%S %Z')
          echo "::notice title=ET drift check::Current America/Toronto time is ${ET_NOW} — this workflow's cron is a single fixed-UTC expression (Spec 115 §2.1); it never skips on DST drift, this notice is observability only."

      - name: Pre-flight — migrate.js --verify (runbook rule 2)
        run: node scripts/migrate.js --verify
        env: *pipeline-env

      - name: Ensure data/ exists (gitignored — absent on every fresh checkout)
        # Pipeline Rehab P2 (2026-08-03): belt to the loaders' own in-code
        # mkdir (downloadFile() now mkdirs the destination dir itself — the
        # in-code fix is the real one, required for local fresh clones too).
        # Four loaders wrote into data/ without creating it, so every
        # scheduled run of this chain ENOENT'd on the first loader step.
        run: mkdir -p data

      - name: Guard — sources concurrency check
        id: sources_guard
        run: node scripts/check-chain-running.js sources >> "$GITHUB_OUTPUT"
        env: *pipeline-env

      - name: Run sources chain
        id: sources
        if: steps.sources_guard.outputs.skip != 'true'
        # Sourced from the job env above (P1 no-second-hardcode). This is the
        # BACKSTOP, never the mechanism — the soft budget below is what should
        # actually stop the chain, finalizing through run-chain's normal terminal
        # path with a recorded reason on every skipped step (Spec 115 §2.2).
        timeout-minutes: ${{ fromJSON(env.SOURCES_STEP_TIMEOUT_MINUTES) }}
        # Soft budget = ceiling − 10, shell-computed (GH expressions have no
        # arithmetic — chain-deep-scrapes.yml precedent), clamped at 0 (= disabled).
        # Before this, BOTH budget env vars were unset for this workflow, so
        # run-chain.js:468 read 0 and the self-stop was inert — which is why the
        # 2026-08-03 run died at the hard ceiling with no prior warning.
        run: |
          BUDGET=$(( ${{ fromJSON(env.SOURCES_STEP_TIMEOUT_MINUTES) }} - 10 ))
          if [ "$BUDGET" -lt 0 ]; then BUDGET=0; fi
          export CHAIN_TIME_BUDGET_MINUTES=$BUDGET
          node scripts/run-chain.js sources
        env: *pipeline-env

      - name: Verdict check — sources (F8 fold 2026-07-20)
        # run-chain.js only process.exit(1)s on a thrown step failure — a
        # verdict-only FAIL (chainStatus = 'completed_with_errors',
        # run-chain.js:587) still exits 0, which would show this workflow
        # green on an audit-FAIL run without this step (mirrors
        # chain-deep-scrapes.yml's existing check-chain-verdict.js step,
        # generalized — Integration HIGH-2 / Observability HIGH).
        id: sources_verdict
        if: always() && steps.sources_guard.outputs.skip != 'true'
        run: node scripts/check-chain-verdict.js sources
        # Inline env (not *pipeline-env): this step ADDITIONALLY carries the
        # duration-tripwire budget, fed from the SAME job-env value the chain
        # step's timeout-minutes reads (P1 — no second hardcode). YAML aliases
        # can't be extended without merge keys, hence the three shared vars are
        # repeated verbatim. Mirrors chain-coa-permits.yml's two verdict steps.
        # ⚠️ Distinct from CHAIN_TIME_BUDGET_MINUTES: that one is run-chain's
        # self-stop (ceiling − 10); this one is check-chain-verdict's tripwire
        # (= ceiling, warns past 80% → 240 min). Deliberately different names.
        env:
          PIPELINE_CHAIN: ${{ github.workflow }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT_PATH: ${{ github.workspace }}/scripts/certs/supabase-ca.pem
          CHAIN_DURATION_BUDGET_MINUTES: ${{ env.SOURCES_STEP_TIMEOUT_MINUTES }}
