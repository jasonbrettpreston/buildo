# chain-deep-scrapes.yml — the 7-step `deep_scrapes` chain (manifest.json:115-118):
# inspections, classify_inspection_status, assert_network_health,
# refresh_snapshot, assert_data_bounds, assert_engine_health, assert_staleness.
#
# SPEC LINK: docs/specs/00-architecture/115_scheduling.md §2, §2.1, §2.4, §3, §4
# SPEC LINK: docs/specs/00-architecture/113_supabase_infrastructure.md §4, §8.2, §8.4, §11
#
# Inertness (P3-D6, Spec 115 §3): `schedule:` committed COMMENTED OUT.
# Phase 4.3 activation = one PR uncommenting it. `workflow_dispatch` active.
#
# Runner (Spec 113 §8.2 option 3, ruled 2026-07-20): GitHub-hosted. The Decodo
# residential proxy carries ALL of aic-orchestrator.py's AIC traffic, so the
# runner's own datacenter IP is never WAF-visible to AIC — the exact property
# that would otherwise argue for a self-hosted runner. Because the proxy
# forces headed Chrome (Spec 115 §2.4), the run step wraps the node PARENT in
# xvfb-run so $DISPLAY inherits down through run-chain.js's spawned python3
# child to the Chrome process nodriver launches — matching the guarded
# RuntimeError aic-scraper-nodriver.py raises if proxy mode is headed with no
# $DISPLAY set (its own error message recommends this exact invocation).
#
# INTEGRATION FINDING (not a spec 115/113 defect — out of scope for both per
# their own Operating Boundaries, which exclude aic-orchestrator.py internals):
# aic-orchestrator.py's get_db_connection() (scripts/aic-orchestrator.py L119-126)
# reads discrete PG_HOST/PG_PORT/PG_DATABASE/PG_USER/PG_PASSWORD env vars via
# psycopg2 — never SUPABASE_DATABASE_URL — and passes no sslmode/sslrootcert,
# so a raw discrete-var wiring here would connect WITHOUT the CA-pinned
# verify-full TLS Spec 113 §4 mandates. The "Derive PG_* env" step below
# parses SUPABASE_DATABASE_URL into those discrete vars AND sets
# PGSSLMODE=verify-full / PGSSLROOTCERT=<CA path> — libpq (which psycopg2
# wraps) reads PGSSLMODE/PGSSLROOTCERT as environment-variable defaults for
# any connection parameter not explicitly passed in code, so this closes the
# TLS gap without touching the .py file (out of scope for this spec).

name: chain-deep-scrapes

on:
  # SCHEDULE DISABLED (WF2 restore, rung L0 — 2026-07-30). Operator-ruled.
  #
  # The scraper's MODULE defaults (MAX_RETRIES=3, RETRY_BASE_MS=2000,
  # WAF_TRAP_THRESHOLD=20) are correct for the attested unproxied local path and
  # measurably wrong against this edge, which blocks at ~12 requests / ~10 min and
  # clears only after ~5 min idle. The env block below therefore sets the recon's
  # MEASURED cloud values; shipping the defaults here is what produced a run of 654
  # requests, 0 rows and 102 WAF traps.
  #
  # RE-ENABLING THIS BLOCK IS NOT A ONE-LINE CHANGE. Scheduled runs are unattended,
  # so before uncommenting: a dispatch probe must have demonstrated a non-zero row
  # count, and the constants below must be the values that probe used, cited to its
  # run id. Cadence and caps below are probe-shaped by default and must be raised
  # deliberately for production.
  #
  # Cadence when restored (Spec 115 §2 row 4, §2.1 — unchanged, only disabled):
  #     cron: '0 15,18,21 * * 1-5'   # weekdays, business hours across both DST regimes
  # schedule:
  #   - cron: '0 15,18,21 * * 1-5'
  workflow_dispatch:
    # A validation probe must fail FAST. With a 90s retry base, one blocked permit
    # costs 90+180+360s on retries alone, so an unparameterised dispatch sits near
    # the chain timeout before telling you anything. These inputs make a probe cheap
    # to run and quick to read; the defaults are probe-shaped, not production-shaped.
    inputs:
      max_permits:
        description: 'Permit cap (small = probe, 0 = unlimited/production)'
        required: false
        default: '3'
      max_retries:
        description: 'Retries per permit (1 = fail fast; 3 = production)'
        required: false
        default: '1'
      chain_timeout_minutes:
        description: 'Hard stop for the chain step'
        required: false
        default: '12'

jobs:
  deep-scrapes:
    runs-on: ubuntu-latest   # Spec 113 §8.2 option 3 (Network Restrictions off + strong auth) — resolved 2026-07-20
    # Fixed, not derived: GitHub Actions expressions have no arithmetic operators,
    # so this cannot be "chain timeout + setup headroom". Sized from the stage-1
    # throughput proving run (P7 stage 2 prep, 2026-08-03 — run 30843114683:
    # 100 permits / 12.6 min = 7.5s/permit, miss-rate 5.0%, zero WAF blocks,
    # ledger 0 write failures): a 150-min chain timeout ≈ 1,200 permits at that
    # rate; 170 = 150 largest-expected chain timeout + setup headroom. Slots are
    # 3h apart, so 150 keeps a run inside its slot before the concurrency guard
    # would skip the next. The chain step carries its own, tighter, input-driven
    # limit. (Was 45 — probe-shaped; it would kill any full-throughput run.)
    timeout-minutes: 170
    concurrency:
      group: ${{ github.workflow }}   # F8 fold 2026-07-20: derived from the workflow name so a
      cancel-in-progress: false       # future rename can't drift the concurrency group out of sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r scripts/requirements.txt

      - name: Install Xvfb (proxy-forced headed Chrome requires a display server)
        # F8 fold 2026-07-20: no `apt-get update` here — xvfb is a stock
        # Ubuntu package and no third-party repo has been added at this
        # point in the job (unlike the PG17-client step elsewhere, which
        # DOES need one immediately after adding the PGDG repo).
        run: sudo apt-get install -y xvfb

      # PROFILE CACHE DELETED (WF2 restore, rung L0 — 2026-07-30).
      #
      # `actions/cache` restored `~/.buildo-scraper` between runs to keep the browser
      # fingerprint stable. It also restored Chrome's host-scoped `Singleton*` locks,
      # which name a dead host/PID and make Chrome refuse to start — and because an
      # honest verdict means a FAILED run never saves a fresh cache entry, the one
      # poisoned entry was restored FOREVER. It bricked every cloud run until found.
      # See tasks/lessons.md and .cursor/wf2_deep_scrapes_restore.md (C2).
      #
      # DO NOT RESTORE THIS STEP without also solving lock stripping at restore time.
      # `clear_stale_profile_locks()` in the scraper is the second layer, not a licence
      # to bring the cache back — belt and braces, not belt or braces.
      #
      # FENCE PRESERVED FROM THE DELETED STEP: never add a `pull_request`-family trigger
      # to this workflow. It spawns a real browser with residential-proxy credentials in
      # scope, and a fork-poisonable cache entry restored by a trusted run is the classic
      # GitHub Actions cache-poisoning vector. The fence outlives the cache step.

      - name: Guard — environment (SUPABASE_DATABASE_URL + CA cert + ET drift)
        id: env_guard
        env: &pipeline-env
          PIPELINE_CHAIN: ${{ github.workflow }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT_PATH: ${{ github.workspace }}/scripts/certs/supabase-ca.pem
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "::error::SUPABASE_DATABASE_URL is empty — refusing to proceed (Spec 115 §3/§4 item 3 fail-safe-loud posture)."
            exit 1
          fi
          if [ ! -f "$SUPABASE_CA_CERT_PATH" ]; then
            echo "::error::CA cert not found at SUPABASE_CA_CERT_PATH=$SUPABASE_CA_CERT_PATH — every non-loopback connection in this workflow requires it (Spec 113 §4.2/§4.3). scripts/lib/ssl-config.js will throw the same fact per-connection if this guard is bypassed."
            exit 1
          fi
          ET_NOW=$(TZ='America/Toronto' date '+%Y-%m-%d %H:%M:%S %Z')
          echo "::notice title=ET drift check::Current America/Toronto time is ${ET_NOW} — this workflow's cron is a single fixed-UTC expression (Spec 115 §2.1); the §2 table's business-hours slots are chosen to stay in-window under both DST regimes."

      - name: Pre-flight — migrate.js --verify (runbook rule 2)
        run: node scripts/migrate.js --verify
        env: *pipeline-env

      - name: Derive PG_* connection vars for aic-orchestrator.py (+ TLS bridge)
        # See the file-header INTEGRATION FINDING above.
        run: |
          node -e "
            const u = new URL(process.env.SUPABASE_DATABASE_URL);
            const lines = [
              'PG_HOST=' + u.hostname,
              'PG_PORT=' + (u.port || '5432'),
              'PG_DATABASE=' + decodeURIComponent(u.pathname.replace(/^\//, '')),
              'PG_USER=' + decodeURIComponent(u.username),
              'PG_PASSWORD=' + decodeURIComponent(u.password),
              'PGSSLMODE=verify-full',
              'PGSSLROOTCERT=' + process.env.SUPABASE_CA_CERT_PATH,
            ];
            require('fs').appendFileSync(process.env.GITHUB_ENV, lines.join('\n') + '\n');
          "
        env: *pipeline-env

      - name: Mask PG_PASSWORD in logs (F8 fold 2026-07-20, Security MED)
        # GitHub only auto-masks the EXACT secret string it was given
        # (SUPABASE_DATABASE_URL) — PG_PASSWORD, extracted out of it by the
        # step above and exposed via $GITHUB_ENV starting THIS step, is a
        # different string as far as the log-masking engine is concerned and
        # would otherwise appear in plain text if any later step's output
        # ever echoes it (directly or via a crashing child process). Mask it
        # explicitly, immediately after it becomes available.
        run: echo "::add-mask::$PG_PASSWORD"

      - name: Allow Chrome sandboxed launch (Ubuntu 24 AppArmor userns restriction)
        # ubuntu-latest (24.04) ships kernel.apparmor_restrict_unprivileged_userns=1,
        # which kills Chrome's sandboxed launch instantly — nodriver reports
        # "Failed to connect to browser" after 3 bootstrap attempts (first-cron
        # finding 2026-07-29, run 30485096998: 0 permits attempted against a
        # 10,981-pending queue). Relaxing the sysctl preserves Chrome's REAL
        # sandbox — identical browser behavior to local operator runs, no
        # --no-sandbox launch-flag divergence for the WAF-sensitive scraper.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Guard — deep_scrapes concurrency check
        id: deep_scrapes_guard
        run: node scripts/check-chain-running.js deep_scrapes >> "$GITHUB_OUTPUT"
        env: *pipeline-env

      - name: Run deep_scrapes chain
        id: deep_scrapes
        if: steps.deep_scrapes_guard.outputs.skip != 'true'
        timeout-minutes: ${{ fromJSON(inputs.chain_timeout_minutes || '12') }}
        # Wraps the node PARENT (run-chain.js), not the python child directly,
        # so $DISPLAY is present in the environment run-chain.js spawns its
        # python3 child with (run-chain.js's stepEnv = {...process.env, ...} —
        # it inherits whatever xvfb-run set on this shell).
        #
        # Soft time-budget self-stop (F1, 2026-08-04): the scraper stops
        # claiming batches 10 min before this step's GH hard kill and
        # finalizes clean (summary + ledger + queue release + exit 0) — run
        # 30854595411 was healthy yet SIGKILLed mid-scrape, leaving orphaned
        # pipeline_runs rows + stuck claims + a red verdict. GH expressions
        # have NO arithmetic operators, so the -10 is computed in this shell
        # from the SAME `inputs.chain_timeout_minutes || '12'` expression the
        # step timeout uses; clamped at 0 (= disabled) so a tiny probe
        # timeout falls back to the GH backstop rather than a negative budget.
        # The step timeout-minutes above STAYS as the hard backstop.
        run: |
          BUDGET=$(( ${{ fromJSON(inputs.chain_timeout_minutes || '12') }} - 10 ))
          if [ "$BUDGET" -lt 0 ]; then BUDGET=0; fi
          export SCRAPER_TIME_BUDGET_MINUTES=$BUDGET
          echo "Soft time budget: ${SCRAPER_TIME_BUDGET_MINUTES} min (0 = disabled; GH step timeout is the backstop)"
          xvfb-run -a node scripts/run-chain.js deep_scrapes
        # NOTE: GitHub Actions supports plain YAML anchors/aliases (GA since
        # 2025-09-18) but explicitly does NOT support merge keys (`<<:`) — a
        # merge key here would be a workflow-parse error, not silently
        # ignored. The *pipeline-env keys are therefore repeated verbatim
        # rather than merged; keep this block in sync with the &pipeline-env
        # anchor above if that anchor's keys ever change.
        env:
          PIPELINE_CHAIN: ${{ github.workflow }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_CERT_PATH: ${{ github.workspace }}/scripts/certs/supabase-ca.pem
          PROXY_HOST: ${{ secrets.DECODO_PROXY_HOST }}
          PROXY_PORT: ${{ secrets.DECODO_PROXY_PORT }}
          PROXY_USER: ${{ secrets.DECODO_PROXY_USER }}
          PROXY_PASS: ${{ secrets.DECODO_PROXY_PASS }}
          SCRAPER_WORKERS: ${{ vars.SCRAPER_WORKERS }}
          SCRAPE_BATCH_SIZE: ${{ vars.SCRAPE_BATCH_SIZE }}
          # NOTE: SCRAPE_MAX_PERMITS is set explicitly in the gate block below, not
          # from vars — a repo variable of 0 (unlimited) turned a "first validation"
          # into an unbounded production run. Duplicate YAML keys are last-wins and
          # silent, so this one is deliberately removed rather than left to shadow.
          SCRAPE_PERMIT_TYPE: ${{ vars.SCRAPE_PERMIT_TYPE }}

          # --- Cloud gate block (WF2 restore, C-W) ---------------------------
          # The scraper's DEFAULTS are the attested LOCAL configuration:
          # unproxied, nodriver-launched, no cost guards. Every cloud-specific
          # behaviour is opt-in and selected here, so the artifact the operator
          # proved locally is what runs locally and the runner gets what the
          # runner needs. Do not move any of these into the code as defaults.
          # Transport. PROVEN 2026-07-30: a Chrome-TLS-impersonating HTTP
          # client (curl_cffi) walks the same four /jaxrs/ endpoints and returns
          # identical data at ~6.2 KB/permit against 32 KB for the browser path
          # (105 KB before that day's cuts), because this portal runs
          # rate/reputation control rather than Akamai's JS-sensor product — it
          # sets no _abck/ak_bmsc/bm_sz, so there is no sensor cookie that must
          # be earned in a real browser. The BROWSER path is retained as a live,
          # tested fallback: flip this to `browser` and everything below
          # (attach mode, xvfb, the resource filter) applies again unchanged.
          SCRAPER_TRANSPORT: http
          SCRAPER_PROXY_MODE: relay        # a datacenter IP must never reach AIC direct
          SCRAPER_ATTACH_MODE: '1'         # nodriver's 2.25s handshake budget vs a cold CI profile
          SCRAPER_VERIFY_EGRESS: '1'       # prove proxying, never assume it
          SCRAPER_DEVTOOLS_TIMEOUT_S: '60' # cold-profile readiness budget
          # Cost ceilings. Both layers are mandatory on a metered path: the launch
          # flags stop Chrome's own background traffic at the source, and the
          # relay's blocklist enforces it at the chokepoint. One run without them
          # billed ~1.76 GB (~$6.60), 99.9% of it Chrome talking to Google.
          SCRAPER_BANDWIDTH_GUARD: '1'
          SCRAPER_MAX_BROWSER_LAUNCHES: '12'   # 116 launches was the incident
          # C8/L4 — CDP resource blocking, the ~375x byte lever (v2's filter,
          # ported verbatim). Allow document/xhr/fetch/script, abort the rest;
          # `script` MUST stay allowed (d138bb04: blocking it shadow-bans
          # permanently). Measured 2026-07-30 WITHOUT it: ~10 MB per probe for
          # a ~5 KB/permit data chain — full toronto.ca pages, the portal's
          # map stack, cold-cache every batch.
          SCRAPER_RESOURCE_BLOCKING: '1'
          # Mid-session noise visits OFF in cloud. MEASURED 2026-07-30 (run
          # 30581163413, per-host relay accounting): www.toronto.ca accounted
          # for 3,439,422 of 6,315,971 metered bytes — 54.5% of the bill — for
          # warm-up and noise pages, while the permit data itself is ~5.3 KB.
          # Behavioural noise is what you feed a JS sensor; this portal sets no
          # cookies and gates on cumulative per-IP REQUEST reputation, so each
          # noise event (2 navigations) spends the exact budget it claims to
          # protect. The one scraper that ever produced rows had none.
          SCRAPER_NOISE_VISITS: '0'
          #
          # Akamai-tuned constants. The module DEFAULTS (20 / 2000) are correct for
          # the attested unproxied local path and measurably WRONG here: this portal
          # blocks at ~12 requests / ~10 min per client and clears after ~5 min idle,
          # so a 2s retry ladder fires entirely INSIDE the recovery window and
          # deepens the block, and a threshold of 20 spends 20 requests against an
          # edge that has already stopped answering. The last genuinely-proxied cloud
          # run under these values produced 654 requests, 0 rows and 102 WAF traps.
          #
          # These are the recon's MEASURED values, not guesses, and they are the same
          # properties scripts/tests/test_scraper_config.py::TestAkamaiTunedBackoff
          # asserts. Plan ruling P4 makes setting them a precondition of dispatching.
          #
          # MEASUREMENT CITATION (the C-W merge gate requires these values be
          # tied to the runs that justify them, not merely asserted):
          #   30577993600 — 12 permits, browser transport, threshold 3 / base 90s:
          #     proxy_errors 0, consecutive_empty_max 1, no WAF trap fired.
          #   30581163413 — 60 permits, same constants: consecutive_empty_max 1
          #     across 8 batches, 0 proxy errors, 31 permits scraped.
          #   30589243948 — 60 permits, HTTP transport: 0 proxy errors, 34 found,
          #     85 rows, 10 rotations, no trap.
          # No run under these values has produced a WAF block, so threshold 3 has
          # never actually fired in anger — it is bounded-safe rather than
          # empirically tuned. The retry base is unexercised for the same reason.
          # Re-derive both from a run that DOES get blocked before the cron is
          # re-enabled; until then they are conservative, not proven.
          SCRAPER_WAF_TRAP_THRESHOLD: '3'
          SCRAPER_RETRY_BASE_MS: '90000'
          # HARD CAP for validation dispatches. Without it a "first validation" is an
          # unbounded production run against ~11k queued items, and at ~3 permits per
          # 10 minutes per exit IP it would simply burn the 90-minute window
          # reproducing a block. A small cap makes the result attributable and bounds
          # what finding out costs. Raise deliberately, never by default.
          SCRAPE_MAX_PERMITS: ${{ inputs.max_permits || '3' }}
          # Fail fast on a probe. Each retry waits SCRAPER_RETRY_BASE_MS (90s)
          # doubling, so 3 retries on one blocked permit is ~10 minutes of sleep.
          SCRAPER_MAX_RETRIES: ${{ inputs.max_retries || '1' }}

      - name: Verdict check — deep_scrapes (orchestrator exit-0 masking guard)
        # aic-orchestrator.py exits 0 on a scrape-level failure by design
        # (Integration HIGH-2, Spec 115 §2.4) — a `run-chain.js` exit code of
        # 0 does NOT mean the scrape succeeded. This step separately reads
        # the DB-recorded chain verdict and reddens the job if it was a FAIL.
        if: always() && steps.deep_scrapes_guard.outputs.skip != 'true'
        run: node scripts/check-chain-verdict.js deep_scrapes
        env: *pipeline-env
