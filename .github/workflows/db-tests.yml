name: DB Integration Tests

# Real-Postgres integration tests for the bug class that mocked-pool tests
# can't catch: SQL syntax, constraint violations, FK cascades, geography
# casts, column width truncation. Runs in parallel with the standard test
# job. See docs/specs/00_engineering_standards.md §12.9.

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'src/features/leads/lib/**'
      - 'src/lib/db/**'
      - 'src/tests/db/**'
      - 'scripts/**'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ⚠️ The database is named `postgres`, in lockstep with
    # `src/tests/db/setup-testcontainer.ts`'s TEST_DATABASE_NAME (LW-D16, WF3
    # 2026-09-21). Every converted step declares
    # `database.assert_current_database: "postgres"` and `assertDbTarget`
    # refuses any other name — a production fence that is satisfied here, never
    # weakened. Renaming either side alone reds
    # `src/tests/db-test-harness-target.infra.test.ts`.
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.167
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U postgres -d postgres -c 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # 22: pdfjs-dist 6.x engines >=22.13 (CoA notices, Spec 129)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Install PostgreSQL 17 client
        # The service is Postgres 17; ubuntu's default pg_dump is older, and restore-db.infra.test.ts asserts on a
        # real pg_dump's stderr. Same commands as chain-coa-permits.yml (F8 fold 2026-07-20).
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          # The runner image ships Postgres 16 tools that pg_wrapper keeps picking (2026-10-11 run: 16.15),
          # so put the 17 binaries first on PATH for every later step.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Confirm pg_dump 17 is the one on PATH
        run: pg_dump --version | grep -E ' 17\.'

      - name: Run DB integration tests
        run: npm run test:db
