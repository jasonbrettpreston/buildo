name: Test Suite

# The main vitest suite (8,739 tests as of 2026-08-23) had no CI runner —
# only .husky/pre-commit enforced typecheck+lint+test, and pre-commit is
# bypassable with `--no-verify` or an out-of-band push. This workflow is
# the non-skippable equivalent of that gate.
#
# See .cursor/active_task.md P0c (Spec 122 step-optimization programme,
# "Two CI holes").
#
# No path filter, unlike the scripts/-scoped workflows (pipeline-lint.yml,
# db-tests.yml): the suite spans the whole repo (src/, and scripts/ callers
# of shared src/ libs), so it runs on every PR and every push to main.
#
# Two exclusions on the Vitest step, both first-run findings (push 64ad272a):
#   - src/tests/db/**: db.test.ts files self-skip via
#     src/tests/db/setup-testcontainer.ts's dbAvailable()/pool guard ONLY
#     when no CI provisions a DB at all. GitHub Actions sets `CI=true` on
#     every job (this one included), and the guard reads that as "an
#     opted-in run with no pool is a false-green, throw" — a design that
#     predates this job existing. db-tests.yml is this tier's owner: it
#     provisions the real Postgres service and runs it on the same
#     pull_request/push triggers, so excluding here loses no coverage.
#   - src/tests/admin-lead-schemas.contract.test.ts: dynamically imports
#     mobile/src/lib/schemas.ts, which pulls in mobile/tsconfig.json
#     ("extends": "expo/tsconfig.base") — unresolvable without
#     mobile/node_modules. Installing the mobile tree here (47 deps,
#     ~17K-line lockfile) on every PR just for one contract test costs
#     more than mobile-ci.yml's own install, which is at least gated to
#     mobile/** changes. This file runs locally via .husky/pre-commit's
#     `npm run test` (developers have mobile/node_modules installed) —
#     it is not otherwise covered in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck + Lint + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: >-
          npm run test -- --exclude "src/tests/db/**"
          --exclude "src/tests/admin-lead-schemas.contract.test.ts"
