name: Pipeline Lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'eslint.config.mjs'
      - 'ruff.toml'
      - 'migrations/**'

jobs:
  boy-scout:
    name: Boy Scout Rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/enforce-boy-scout.sh

  eslint:
    name: ESLint (Pipeline JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint scripts/

  ruff:
    name: Ruff (Pipeline Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check scripts/*.py

  pytest:
    # Unit harness for scripts/*.py — no DB, no browser, no network.
    # Exists because three consecutive cloud-only failures (2026-07-29 runs
    # 30485096998 / 30487133930 / 30490094619) were all pure-logic seams in
    # the scraper/orchestrator: an empty-string env var defeating an int
    # default, a total worker wipeout reporting PASS, and a bootstrap tripwire
    # masking nodriver's real error. Each cost a ~6-minute Actions round-trip
    # to find; all four are now pinned here.
    name: Pytest (Pipeline Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Runtime deps too: the harness imports the real modules rather than
      # re-implementing them, so a missing dep must fail here, not skip.
      - run: pip install -r scripts/requirements.txt -r scripts/requirements-dev.txt
      - run: python -m pytest scripts/tests

  step-shape:
    # A2 (Spec 122 §5.1) — the frozen step-file shape. Under islands a step needs
    # no override key to escape the standard: it can simply not call
    # pipeline.step(). Without this gate §4 is a style guide.
    #
    # Two modes, one driver. The BLOCKING half enforces over the committed
    # scripts/steps/_schema/converted.json list (empty today — each C1 pilot
    # appends one entry as its final commit, so the gate arms one step at a time).
    # The REPORT-ONLY half sweeps the rest of the manifest corpus and prints the
    # prove-red; it is informational and never fails the job.
    #
    # .husky/pre-commit reaches the same driver through
    # scripts/hooks/ast-grep-leads.sh; this job is the non-skippable equivalent
    # (pre-commit is bypassable with --no-verify).
    name: Step Shape (Spec 122 §5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run step-shape

  validate-migrations:
    # Regression-lock for the mig-118 antipattern (active SQL after `-- DOWN`
    # crashes scripts/migrate.js because the runner doesn't parse markers).
    # Pre-commit hook also enforces validate-migration.js, but `--no-verify`
    # or out-of-band pushes would bypass it; this CI gate catches them BEFORE
    # db-tests.yml fails on every fresh DB.
    name: Migration Safety Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/validate-migration.js migrations/*.sql
