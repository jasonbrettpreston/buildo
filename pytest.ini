; Pipeline python harness (scripts/*.py).
; SPEC LINK: docs/specs/01-pipeline/47_pipeline_script_protocol.md
;
; Scope: unit-level by default — no browser, and no DB EXCEPT for cases marked
; `@pytest.mark.dbtest`, which use the `live_db` fixture and SELF-SKIP when no
; Postgres is reachable (WF3 P0, 2026-08-19: Spec 119 §2's "Live-DB smoke" tier —
; a mocked connection cannot prove a `SET` took EFFECT, only that it was called).
; The pipeline chains never install scripts/requirements-dev.txt, so this harness
; cannot affect a production run.
; Run with `npm run test:py`; CI runs it as the `pytest` job in pipeline-lint.yml,
; which has NO postgres service — so the dbtest cases skip there by design.
[pytest]
testpaths = scripts/tests
asyncio_mode = auto
addopts = -q --strict-markers
markers =
    dbtest: requires a reachable Postgres (uses the `live_db` fixture; self-skips otherwise)
