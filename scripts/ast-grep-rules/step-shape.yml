id: step-no-pipeline-run
language: JavaScript
severity: error
message: |
  `pipeline.run(` is banned outright in a converted step file (Spec 122 §5.1).

  The whole lifecycle moved into `pipeline.step(descriptor, compute)`: the library
  runs BEFORE compute does, AJV-validates the descriptor and throws (§4.2). A step
  that still calls `pipeline.run()` has kept its island — it opens its own pool,
  owns its own ledger row, and answers to no descriptor. That is the situation this
  programme exists to end, and its failure mode is silent.

  SPEC LINK: docs/specs/01-pipeline/122_pipeline_step_optimization.md §5.1
note: |
  Enforcement scope is scripts/steps/_schema/converted.json — see step-shape's note.
  In report-only mode this is the assertion that fires on all 27 unconverted files.
files:
  # ⚠️ SCOPE GUARD, measured 2026-08-24. sgconfig.yml `ruleDirs` auto-loads every
  # rule in this directory into `ast-grep scan <path>`, and section 1 of
  # scripts/hooks/ast-grep-leads.sh scans src/features/leads — which contains two
  # plain .js files. Without this glob the shape rule fired 35 times there and
  # reddened an unrelated pre-commit gate. The A2 corpus is scripts/ only; the
  # driver passes explicit paths inside it.
  - 'scripts/**/*.js'
rule:
  pattern: pipeline.run($$$)
